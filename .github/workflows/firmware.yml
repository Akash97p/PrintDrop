name: Firmware

on:
  push:
    tags:
      - "v*"
    branches: [main, "feat/**", "feature/**"]
    paths:
      - "src/**"
      - "platformio.ini"
      - "partitions_*.csv"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "src/**"
      - "platformio.ini"
      - "partitions_*.csv"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      - name: Install PlatformIO
        run: |
          pip install -U platformio
          pio --version
      - name: Build SDIO (printdrop)
        run: pio run -e printdrop
      - name: Build SPI (printdrop_spi)
        run: pio run -e printdrop_spi
      - name: Build LittleFS (SDIO)
        run: pio run -e printdrop -t buildfs
      - name: Prepare artifacts
        run: |
          set -e
          mkdir -p dist
          VER="${GITHUB_REF_NAME}"
          # fallback version from platformio.ini if not a tag
          if [[ "$VER" != v* ]]; then VER="0.2.0-dev-${GITHUB_SHA::7}"; fi
          CLEAN_VER="${VER#v}"
          echo "Version $CLEAN_VER (ref $GITHUB_REF_NAME)"
          # Copy raw firmware bins
          cp .pio/build/printdrop/firmware.bin dist/printdrop-sdio-${CLEAN_VER}.bin
          cp .pio/build/printdrop_spi/firmware.bin dist/printdrop-spi-${CLEAN_VER}.bin
          cp .pio/build/printdrop/littlefs.bin dist/littlefs-${CLEAN_VER}.bin || echo "no littlefs"
          cp .pio/build/printdrop/partitions.bin dist/partitions-${CLEAN_VER}.bin || true
          cp .pio/build/printdrop/bootloader.bin dist/bootloader-${CLEAN_VER}.bin || true
          cp .pio/build/printdrop/boot_app0.bin dist/boot_app0-${CLEAN_VER}.bin || true
          # Create merged full images for initial flash (esptool merge)
          # ESP32-S3 OTA layout: bootloader 0x0, partitions 0x8000, boot_app0 0xe000, firmware 0x10000, littlefs 0x2B0000
          # Use pio's esptool if available, else pip esptool
          pip install esptool
          # SDIO merged
          esptool.py --chip esp32s3 merge_bin -o dist/printdrop-sdio-full-${CLEAN_VER}.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 .pio/build/printdrop/bootloader.bin \
            0x8000 .pio/build/printdrop/partitions.bin \
            0xe000 .pio/build/printdrop/boot_app0.bin \
            0x10000 .pio/build/printdrop/firmware.bin \
            0x2B0000 .pio/build/printdrop/littlefs.bin || echo "merge sdio failed"
          # SPI merged: use printdrop_spi partitions (same layout, different firmware)
          cp .pio/build/printdrop/partitions.bin dist/partitions-spi-${CLEAN_VER}.bin || true
          cp .pio/build/printdrop_spi/bootloader.bin dist/bootloader-spi-${CLEAN_VER}.bin || true
          cp .pio/build/printdrop_spi/boot_app0.bin dist/boot_app0-spi-${CLEAN_VER}.bin || true
          esptool.py --chip esp32s3 merge_bin -o dist/printdrop-spi-full-${CLEAN_VER}.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 .pio/build/printdrop_spi/bootloader.bin \
            0x8000 .pio/build/printdrop_spi/partitions.bin \
            0xe000 .pio/build/printdrop_spi/boot_app0.bin \
            0x10000 .pio/build/printdrop_spi/firmware.bin \
            0x2B0000 .pio/build/printdrop/littlefs.bin || echo "merge spi failed"
          ls -lh dist/
          sha256sum dist/* > dist/SHA256SUMS.txt || true
          cat dist/SHA256SUMS.txt
          # Prepare manifest for esp-web-tools (optional, hosted via Pages if copied)
          mkdir -p dist/manifest
          cat > dist/manifest/manifest-sdio-${CLEAN_VER}.json <<EOF
          {
            "name": "PrintDrop SDIO ${CLEAN_VER}",
            "version": "${CLEAN_VER}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/bootloader-${CLEAN_VER}.bin", "offset": 0},
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/partitions-${CLEAN_VER}.bin", "offset": 32768},
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/boot_app0-${CLEAN_VER}.bin", "offset": 57344},
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/printdrop-sdio-${CLEAN_VER}.bin", "offset": 65536},
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/littlefs-${CLEAN_VER}.bin", "offset": 28311552}
                ]
              }
            ]
          }
          EOF
          cat > dist/manifest/manifest-spi-${CLEAN_VER}.json <<EOF
          {
            "name": "PrintDrop SPI ${CLEAN_VER}",
            "version": "${CLEAN_VER}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/bootloader-spi-${CLEAN_VER}.bin", "offset": 0},
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/partitions-spi-${CLEAN_VER}.bin", "offset": 32768},
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/boot_app0-spi-${CLEAN_VER}.bin", "offset": 57344},
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/printdrop-spi-${CLEAN_VER}.bin", "offset": 65536},
                  {"path": "https://github.com/Akash97p/PrintDrop/releases/download/${VER}/littlefs-${CLEAN_VER}.bin", "offset": 28311552}
                ]
              }
            ]
          }
          EOF
          cat dist/manifest/*.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: firmware
          path: dist
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
