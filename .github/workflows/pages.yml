name: Documentation site

on:
  push:
    # Validate the site on dev and feature branches without deploying; deploy
    # only happens from main (see deploy job condition).
    branches: [main, dev, "feat/**", "feature/**"]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "assets/printdrop_banner.webp"
      - "data/logo.webp"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - uses: actions/configure-pages@v6
      - name: Build static site
        # Invoked through bash rather than executed directly: this repository is
        # developed on a Windows filesystem, which does not carry the exec bit,
        # so relying on it silently breaks the build.
        run: bash scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # Only the main branch publishes to Pages; feature branches just validate.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
